name: Build PlayQuiz

# Trigger: manual click in Actions tab, or push a tag matching playquiz-v*
on:
  workflow_dispatch:
  push:
    tags:
      - "playquiz-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: PlayQuiz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build JAR with Maven
        run: mvn clean package

      - name: Find the built JAR
        id: find_jar
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Path "target" -Filter "*.jar" |
                 Where-Object { $_.Name -notmatch 'sources|javadoc' } |
                 Select-Object -First 1
          Write-Host "JAR: $($jar.Name)"
          "JAR_NAME=$($jar.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ---------- Windows ----------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          jpackage `
            --type app-image `
            --name "PlayQuiz" `
            --app-version "1.0.0" `
            --icon "assets\icon.ico" `
            --input target `
            --main-jar "${{ steps.find_jar.outputs.JAR_NAME }}" `
            --main-class com.dipsana.quiz.Main `
            --win-console `
            --dest installer

      # ---------- macOS ----------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          jpackage \
            --type dmg \
            --name "PlayQuiz" \
            --app-version "1.0.0" \
            --icon "assets/icon.png" \
            --input target \
            --main-jar "${{ steps.find_jar.outputs.JAR_NAME }}" \
            --main-class com.dipsana.quiz.Main \
            --dest installer

      # ---------- Linux ----------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --type deb \
            --name "PlayQuiz" \
            --app-version "1.0.0" \
            --icon "assets/icon.png" \
            --input target \
            --main-jar "${{ steps.find_jar.outputs.JAR_NAME }}" \
            --main-class com.dipsana.quiz.Main \
            --dest installer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayQuiz-${{ matrix.os }}
          path: PlayQuiz/installer/

  release:
    name: Attach artifacts to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/playquiz-v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f | head -100

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.jar
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
